name: decvault
description: A decentralized, privacy-focused password manager with seed phrase authentication.

version: 1.0.7+13

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  uuid: ^4.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  bip39: ^1.0.6
  encrypt: ^5.0.3
  local_auth: ^2.3.0
  get: ^4.6.6
  flutter_svg: ^2.0.17
  intl: ^0.19.0
  shared_preferences: ^2.3.5
  crypto: ^3.0.6
  http: ^1.3.0
  app_links: ^6.3.2
  url_launcher: ^6.3.1
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.0
  share_plus: ^10.1.4
  media_scanner: ^2.1.0
  permission_handler: ^11.3.1
  desktop_drop: ^0.5.0
  cross_file: ^0.3.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4
  window_manager: ^0.4.3
  flutter_local_notifications: ^18.0.1

  cupertino_icons: ^1.0.8
  bip32: ^2.0.0
  hex: ^0.2.0
  sha3: ^0.2.0
  purchases_flutter: ^8.6.0
  purchases_ui_flutter: ^8.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^1.1.3
  build_runner: ^2.4.6
  dart_code_metrics: 4.19.2
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.1
  msix: ^3.16.7

flutter:
  uses-material-design: true
  assets:
    - assets/svgs/
    - assets/icon/
    - assets/splash/
    - assets/logo/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter_native_splash:
  color: "#000000"
  image: assets/splash/splash.png
  image_dark: assets/splash/splash.png
  color_dark: "#000000"
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

msix_config:
  display_name: DecVault
  publisher_display_name: DecVault
  identity_name: com.decvault.app
  msix_version: 1.0.1.0
  logo_path: assets\icon\icon.png
  capabilities: internetClient, internetClientServer, privateNetworkClientServer, location
  execution_alias: decvault
  install_certificate: false
  store: false